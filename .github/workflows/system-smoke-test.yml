name: System Smoke Test

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: "Dataset to test"
        required: true
        default: "btc-usd-yahoo-1d"

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Run system smoke test
        env:
          API: https://oraculum-data-api.4avalonuse.workers.dev
          DATASET_ID: ${{ inputs.dataset_id }}
        run: |
          set -euo pipefail

          pass=0
          total=0

          check() {
            total=$((total + 1))
            name="$1"
            if "$@"; then
              echo "PASS: $name"
              pass=$((pass + 1))
            else
              echo "FAIL: $name"
              return 1
            fi
          }

          echo "=== ORACULUM SYSTEM SMOKE TEST ==="
          echo "API: $API"
          echo "Dataset: $DATASET_ID"
          echo

          health="$(curl --fail-with-body --silent --show-error "$API/api/health")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || x.database!=="d1") process.exit(1)' "$health"
          echo "PASS: health + D1"

          datasets="$(curl --fail-with-body --silent --show-error "$API/api/datasets")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || !Array.isArray(x.data) || x.data.length < 1) process.exit(1)' "$datasets"
          echo "PASS: datasets"

          dataset="$(curl --fail-with-body --silent --show-error "$API/api/datasets/$DATASET_ID")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || !Array.isArray(x.data) || x.data.length < 1) process.exit(1)' "$dataset"
          echo "PASS: candles"

          raw_before="$(curl --fail-with-body --silent --show-error "$API/api/datasets/$DATASET_ID/raw")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || !Array.isArray(x.data)) process.exit(1)' "$raw_before"
          echo "PASS: raw ingestion endpoint"

          refresh_file="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -X POST "$API/api/datasets/$DATASET_ID/refresh" > "$refresh_file"
          node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(!x.ok || !x.refresh || x.refresh.fetched <= 0 || x.refresh.normalized <= 0 || !Array.isArray(x.data) || x.data.length === 0) process.exit(1);
            console.log(JSON.stringify({fetched:x.refresh.fetched,normalized:x.refresh.normalized,finalCount:x.refresh.finalCount,barsReturned:x.data.length},null,2));
          ' "$refresh_file"
          echo "PASS: real refresh + D1 persistence"

          raw_after="$(curl --fail-with-body --silent --show-error "$API/api/datasets/$DATASET_ID/raw")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || !Array.isArray(x.data) || x.data.length < 1 || x.data[0].request_status!=="ok") process.exit(1)' "$raw_after"
          echo "PASS: post-refresh ingestion log"

          status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$API/api/datasets/does-not-exist")"
          test "$status" = "404"
          echo "PASS: 404 handling"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🟩 ORACULUM SYSTEM SMOKE TEST

          | Test | Result |
          |---|---|
          | Health + D1 | ✅ PASS |
          | Datasets | ✅ PASS |
          | Candles | ✅ PASS |
          | Raw ingestion | ✅ PASS |
          | Real refresh | ✅ PASS |
          | D1 persistence | ✅ PASS |
          | Post-refresh log | ✅ PASS |
          | 404 handling | ✅ PASS |

          ## RESULT: 🟩 SYSTEM OK

          **Dataset:** `$DATASET_ID`

          The Worker answered, D1 was reachable, real provider ingestion completed, data persisted, and the ingestion log was updated.
          EOF

          echo
          echo "========================================"
          echo "🟩 ORACULUM SYSTEM OK"
          echo "========================================"
