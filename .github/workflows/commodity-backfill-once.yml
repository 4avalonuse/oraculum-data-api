name: One-time commodity historical backfill
# One-shot runner retry after browser-compatible FRED request headers are deployed.

on:
  push:
    branches:
      - main

jobs:
  backfill:
    if: contains(github.event.head_commit.message, '[run-commodity-backfill]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Retry WTI full historical backfill
        shell: bash
        run: |
          set -euo pipefail
          dataset_id="oil-wti-spot-fred-1d"
          attempt=1
          max_attempts=6

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::WTI attempt ${attempt}/${max_attempts}"
            body="$(curl --silent --show-error --max-time 180 \
              -X POST \
              "https://oraculum-data-api.4avalonuse.workers.dev/api/datasets/${dataset_id}/refresh")"
            echo "$body" | jq -c .
            skipped="$(echo "$body" | jq -r '.refresh.skipped // false')"
            error="$(echo "$body" | jq -r '.error // empty')"
            message="$(echo "$body" | jq -r '.message // empty')"

            if [ "$skipped" = "true" ] || echo "$body" | jq -e '.retryAfterMs != null' >/dev/null 2>&1 || [ "$error" = "refresh_in_progress" ]; then
              wait_ms="$(echo "$body" | jq -r '.refresh.nextRefreshAfterMs // .retryAfterMs // 15000')"
              wait_seconds=$(( (wait_ms + 999) / 1000 + 3 ))
              if [ "$wait_seconds" -lt 10 ]; then wait_seconds=10; fi
              if [ "$wait_seconds" -gt 3600 ]; then wait_seconds=3600; fi
              echo "Refresh is cooling down or already running; waiting ${wait_seconds}s."
              echo "::endgroup::"
              sleep "$wait_seconds"
              attempt=$((attempt + 1))
              continue
            fi

            if [ "$error" = "internal_error" ] && [[ "$message" == *"fred_http_520"* ]]; then
              echo "FRED returned a transient HTTP 520; retrying in 30 seconds."
              echo "::endgroup::"
              sleep 30
              attempt=$((attempt + 1))
              continue
            fi

            if [ -n "$error" ]; then
              echo "WTI backfill failed: ${error} ${message}" >&2
              echo "::endgroup::"
              exit 1
            fi

            normalized="$(echo "$body" | jq -r '.refresh.normalized // 0')"
            final_count="$(echo "$body" | jq -r '.refresh.finalCount // 0')"
            if [ "$normalized" -gt 0 ] && [ "$final_count" -gt 0 ]; then
              echo "WTI backfill complete: normalized=${normalized}, finalCount=${final_count}"
              echo "::endgroup::"
              exit 0
            fi

            echo "No verified persisted rows reported for WTI." >&2
            echo "::endgroup::"
            exit 1
          done

          echo "WTI backfill exhausted retries." >&2
          exit 1
